name: Android

# Staged Android bring-up.
#   Stage 1a (this job): prove the engine + vendored dependencies cross-compile
#     for arm64-v8a with the NDK toolchain, producing libmain.so.
#   Stage 1b (later): wrap in a Gradle/SDLActivity project to produce an APK.
#
# Notes:
#   * The vendored deps use ExternalProject, which needs the Unix Makefiles
#     generator (Ninja rejects the undeclared byproducts). This matches how the
#     project builds upstream (tools/build_appimage.sh: cmake .. + make).
#   * Cross-compiling needs a HOST tolua++ (a build-time code generator turning
#     the .pkg bindings into tolua.cpp); the arm64 tolua++ can't run on x86.
#     tolua++ is produced as part of the vendored "lua" ExternalProject.
#   * genversion is already handled by CMake when cross-compiling (it writes
#     version-generated.h at configure time instead of running the tool).
on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'third-party'
      - 'android/**'
      - '.github/workflows/android.yml'

jobs:
  native-arm64:
    name: Native arm64-v8a (NDK cross-compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Locate NDK
        run: |
          echo "Using NDK at: $ANDROID_NDK_LATEST_HOME"
          test -d "$ANDROID_NDK_LATEST_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      # --- Stage A: host tolua++ (code-generation bootstrap for cross-compile) ---
      - name: Build host tolua++
        run: |
          set -x
          cmake -B build-host \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_VENDORED_LUA=ON \
            -DBUILD_VENDORED_MEDIA_LIBS=ON \
            -DBUILD_VENDORED_SDL=ON \
            -DDOWNLOAD_FREEPATS=OFF \
            -DBUILD_TESTING=OFF
          # tolua++ is built as part of the vendored "lua" ExternalProject; the
          # generated executable is named "toluapp" (in lua/src/lua-build/).
          cmake --build build-host --target lua -j"$(nproc)"
          TOLUA="$(find build-host -type f -name 'toluapp' -perm -u+x 2>/dev/null | head -1)"
          if [ -z "$TOLUA" ]; then
            echo "toluapp not found after 'lua' target; doing a full host build."
            cmake --build build-host -j"$(nproc)"
            TOLUA="$(find build-host -type f \( -name 'toluapp' -o -name 'tolua++' \) -perm -u+x 2>/dev/null | head -1)"
          fi
          if [ -z "$TOLUA" ]; then
            echo "::error::host toluapp not found"; find build-host -iname '*tolua*' -type f; exit 1
          fi
          TOLUA="$(readlink -f "$TOLUA")"
          echo "Host tolua++: $TOLUA"
          echo "HOST_TOLUA=$TOLUA" >> "$GITHUB_ENV"

      # --- Stage B: cross-compile the engine for arm64-v8a ---
      - name: Configure (arm64-v8a, android-24)
        run: |
          cmake -B build-android \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/cmake/toolchains/android-arm64.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_VENDORED_LUA=ON \
            -DBUILD_VENDORED_MEDIA_LIBS=ON \
            -DBUILD_VENDORED_SDL=ON \
            -DDOWNLOAD_FREEPATS=OFF \
            -DBUILD_TESTING=OFF \
            -DSTRATAGUS_HOST_TOLUAPP="$HOST_TOLUA"

      - name: Build engine (.so)
        run: |
          cmake --build build-android -j"$(nproc)" || {
            echo "=== Parallel build failed; re-running sequentially (verbose) to surface the exact failing target ==="
            cmake --build build-android -j1 --verbose
          }

      - name: Collect native libraries
        if: always()
        run: |
          mkdir -p out
          find build-android -name '*.so' -exec cp -v {} out/ \; || true
          ls -la out || true

      - name: Upload native libraries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wargushd-native-arm64
          path: out/**
          if-no-files-found: warn
