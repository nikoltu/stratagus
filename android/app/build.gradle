plugins {
    id 'com.android.application'
}

// Location of the prebuilt native library (libmain.so) to package. Override with
//   -PstratagusNativeDir=/abs/path/to/dir/containing/arm64-v8a
// Default: app/src/main/jniLibs (staged there by the copyNativeLibs task or by hand).
def nativeLibsDir = project.hasProperty('stratagusNativeDir') ?
        project.property('stratagusNativeDir') : "${projectDir}/src/main/jniLibs"

// SDL2's Android Java glue is sourced from the SDL version we build against
// (third-party/SDL), not vendored in our tree. Copy it into a generated source
// dir at build time; it is never committed.
def sdlJavaSrc = "${rootDir}/../third-party/SDL/android-project/app/src/main/java"
def sdlJavaGen = layout.buildDirectory.dir("generated/sdl_java").get().asFile

tasks.register('copySdlJava', Copy) {
    from sdlJavaSrc
    into sdlJavaGen
    include 'org/libsdl/app/**'
}

android {
    // The release-check build is built offline; lint's own tools are not fetched for it.
    lint {
        checkReleaseBuilds false
    }
    namespace 'net.wargushd.game'
    compileSdk 34

    defaultConfig {
        applicationId 'net.wargushd.game'
        minSdk 24
        targetSdk 34
        versionCode 340091
        versionName '3.4.91'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    sourceSets {
        main {
            java.srcDirs += sdlJavaGen
            jniLibs.srcDirs = [nativeLibsDir]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            // Explicit so debuggerd reliably emits a native backtrace/tombstone for the
            // in-game-menu HWUI SIGABRT (WargusHD diagnosis; libmain.so stays a Release build).
            debuggable true
            jniDebuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        // The release configuration signed with the debug key, so that it can be installed on
        // the emulator and the test tablets and checked there. Never distributed.
        releaseCheck {
            initWith release
            debuggable false
            jniDebuggable false
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
        }
    }

    // libmain.so is a Release build with debug info; debug APKs keep it as-is (AGP finds no NDK, so
    // stripDebugSymbols copies it unchanged). RELEASE-STRIP (3.5.0, owner option B): for a
    // release / releaseCheck build give AGP the NDK so it strips the library at packaging (~80 MB ->
    // ~9 MB raw); the unstripped copy is kept beside the release for reading crash backtraces.
    if (gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }) {
        ndkVersion '26.3.11579264'
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

// CS4: the HD content the game needs at runtime is NOT part of this repo. It is staged into
// assets/ from the content trees, using the manifest that records where each file belongs under
// files/data on the device (recovered in cycle 419; the mapping was previously implicit in the
// harness's push invocations and written down nowhere).
//
// The trees' location is a local path, so it is supplied as a property -- set wargushdDocsRoot in
// local.properties (gitignored) or pass -PwargushdDocsRoot=... -- never hardcoded here. Same idiom
// as stratagusNativeDir above. Without it the task is skipped and the APK builds without content,
// which is exactly what it did before this task existed.
// Gradle does NOT load local.properties into project properties -- the Android plugin reads it only
// for sdk.dir -- so read it explicitly. Without this the property is silently null and the staging
// task never runs, which is exactly how the first attempt produced an APK with no content.
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) { localPropsFile.withInputStream { localProps.load(it) } }
def docsRoot = project.hasProperty('wargushdDocsRoot') ?
        project.property('wargushdDocsRoot') : localProps.getProperty('wargushdDocsRoot')
def contentGen = layout.buildDirectory.dir("generated/wargushd_assets").get().asFile

tasks.register('stageWargushdContent') {
    outputs.dir contentGen
    // The sources live outside this project and are not declared as inputs, so the task
    // cannot tell when they changed: stage on every build rather than package stale content.
    outputs.upToDateWhen { false }
    doLast {
        if (docsRoot == null) {
            logger.lifecycle("wargushdDocsRoot not set - APK will contain no game content")
            return
        }
        def manifest = new File("${docsRoot}/.wargushd/CS4_CONTENT_MANIFEST.tsv")
        if (!manifest.exists()) {
            throw new GradleException("content manifest not found: ${manifest}")
        }
        // The manifest's first path component selects which tree the file comes from.
        def roots = ['changes': "${docsRoot}/.wargushd/fulltree-changes",
                     'backup' : "${docsRoot}/.wargushd/fulltree-backup",
                     'root'   : "${docsRoot}/fulltree-changes",
                     'tools'  : "${docsRoot}/.wargushd/tools"]
        def out = new File(contentGen, 'wargushd')
        out.deleteDir(); out.mkdirs()
        int copied = 0
        def missing = []
        manifest.eachLine('UTF-8') { line ->
            if (!line.trim()) return
            def (src, rel) = line.split('\t', 2)
            def (treeKey, treeRel) = src.split('/', 2)
            def root = roots[treeKey]
            if (root == null) { missing << line; return }
            def from = new File("${root}/${treeRel}")
            if (!from.isFile()) { missing << line; return }
            def to = new File(out, rel)
            to.parentFile.mkdirs()
            to.bytes = from.bytes
            copied++
        }
        // A partial payload is worse than none: it would install and then fail at runtime with no
        // indication which files were absent.
        if (!missing.isEmpty()) {
            throw new GradleException("content manifest lists ${missing.size()} file(s) not on disk, "
                + "first: ${missing[0]}")
        }
        logger.lifecycle("staged ${copied} content files into assets/wargushd")
    }
}

android.sourceSets.main.assets.srcDirs += contentGen

// LICENCES-ASSETS-STAGING: the licence texts of everything linked into the app, copied byte for byte
// from the file each component ships into assets/licences (NN.txt + index.txt, read by
// LicencesSheet), on every build. Replaces the hand-run tools/stage-licences.py (same list, same
// order, same index format). The game scripts' licence (Wargus COPYING) is kept beside the scripts'
// backup tree in the docs repo, so it is staged only when the content is (wargushdDocsRoot set).
// A listed text that is not on disk fails the build: a release must not ship without it.
def licencesGen = layout.buildDirectory.dir("generated/wargushd_licences").get().asFile
tasks.register('stageWargushdLicences') {
    outputs.dir licencesGen
    outputs.upToDateWhen { false }
    doLast {
        def engine = new File("${rootDir}/..").canonicalPath.replace('\\', '/')
        def tp = 'third-party/'
        def parts = [
            ['Stratagus (the engine)', 'COPYING'],
            ['Wargus (the game scripts)', docsRoot == null ? null : 'docs:.wargushd/fulltree-backup/COPYING'],
            ['SDL2', tp + 'SDL/LICENSE.txt'],
            ['SDL2_image', tp + 'SDL_image/LICENSE.txt'],
            ['SDL2_mixer', tp + 'SDL_mixer/LICENSE.txt'],
            ['Lua 5.1', tp + 'lua-5.1.5/COPYRIGHT'],
            ['tolua++', tp + 'lua-5.1.5/toluapp-simple/COPYRIGHT'],
            ['guisan', tp + 'guisan/COPYING'],
            ['libpng', tp + 'SDL_image/external/libpng/LICENSE'],
            ['zlib (its README, which carries the licence)', tp + 'SDL_image/external/zlib/README'],
            ['libjpeg (its README, which carries the licence)', tp + 'SDL_image/external/jpeg/README'],
            ['libmng', tp + 'libmng/LICENSE'],
            ['Little CMS', tp + 'lcms/COPYING'],
            ['bzip2', tp + 'bzip2/LICENSE'],
            ['libogg', tp + 'SDL_mixer/external/ogg/COPYING'],
            ['libvorbis', tp + 'SDL_mixer/external/vorbis/COPYING'],
            ['libtheora (COPYING)', tp + 'theora/COPYING'],
            ['libtheora (LICENSE)', tp + 'theora/LICENSE'],
            // Compiled into the engine (CMakeLists.txt: target_include_directories of stratagus_lib).
            ['mdns', tp + 'mdns/LICENSE'],
            ['spiritless_po', tp + 'spiritless_po/LICENSE'],
            // Compiled into SDL2_mixer by its own defaults under the options in third-party/CMakeLists.txt
            // (SDL2MIXER_MIDI=ON -> TiMidity; SDL2MIXER_MP3 default ON -> dr_mp3).
            ['TiMidity (in SDL2_mixer)', tp + 'SDL_mixer/src/codecs/timidity/COPYING'],
            ['dr_mp3 (in SDL2_mixer)', tp + 'SDL_mixer/src/codecs/dr_libs/LICENSE'],
            // unsf is built only with DOWNLOAD_FREEPATS=ON; the Android build sets it OFF
            // (tools/build-android-local.ps1), so it is not in the app and not listed.
        ].findAll { it[1] != null }
        def out = new File(licencesGen, 'licences')
        out.deleteDir(); out.mkdirs()
        def index = []
        def missing = []
        parts.eachWithIndex { part, i ->
            def (name, rel) = part
            def from = rel.startsWith('docs:') ? new File("${docsRoot}/${rel.substring(5)}")
                                               : new File("${engine}/${rel}")
            def shown = rel.startsWith('docs:') ? rel.substring(5) : rel
            if (!from.isFile()) { missing << name; return }
            def dst = String.format('%02d.txt', index.size() + 1)
            new File(out, dst).bytes = from.bytes
            index << "${dst} | ${name} | ${shown}"
        }
        if (!missing.isEmpty()) {
            throw new GradleException("licence text(s) not on disk: ${missing.join(', ')}")
        }
        new File(out, 'index.txt').setText(index.join('\n') + '\n', 'UTF-8')
        logger.lifecycle("staged ${index.size()} licence texts into assets/licences")
    }
}

android.sourceSets.main.assets.srcDirs += licencesGen

tasks.configureEach { task ->
    if (task.name == 'preBuild') {
        task.dependsOn 'copySdlJava'
    }
}

// The asset merge, not preBuild, is what has to see the staged files: wiring this through preBuild
// left the task out of the graph entirely on the first attempt.
tasks.configureEach { task ->
    // Lint's model tasks of a release-type build read the merged asset folders as well.
    if ((task.name.startsWith('merge') && task.name.endsWith('Assets'))
            || (task.name.startsWith('generate') && task.name.contains('Lint'))
            || (task.name.startsWith('lint') && task.name.contains('Vital'))) {
        task.dependsOn 'stageWargushdContent'
        task.dependsOn 'stageWargushdLicences'
    }
}

// BRIDGE-RELEASE (owner 2026-10-07): the debug bridge's command channel exists in debug builds only.
// libmain.so is built outside Gradle (CMake option WARGUSHD_DEBUG_COMMANDS; build-android-local.ps1
// passes OFF for -ReleaseCheck), so a release-type APK could package a library built with the channel
// ON. Refuse that here: the format string "debug bridge commands %s" is compiled only with the channel
// (src/debug/debug_bridge.cpp, DebugBridge_Init); without it the library holds "... not built".
// Debug builds (the gated test APKs, which the device rounds drive through the bridge) are not checked.
tasks.register('checkNoDebugBridgeInRelease') {
    doLast {
        def lib = new File("${nativeLibsDir}/arm64-v8a/libmain.so")
        if (!lib.isFile()) {
            throw new GradleException("release build: ${lib} not found")
        }
        def text = new String(lib.bytes, 'ISO-8859-1')
        if (text.contains('debug bridge commands %s')) {
            throw new GradleException("release build: ${lib} was built with WARGUSHD_DEBUG_COMMANDS=ON "
                + "(the debug bridge command channel). Rebuild it with -DWARGUSHD_DEBUG_COMMANDS=OFF "
                + "(build-android-local.ps1 -ReleaseCheck).")
        }
        if (!text.contains('debug bridge commands not built')) {
            throw new GradleException("release build: ${lib} has neither bridge marker string; "
                + "cannot tell whether the command channel is compiled in")
        }
        logger.lifecycle("libmain.so: debug bridge command channel not built (release OK)")
    }
}
tasks.configureEach { task ->
    if (task.name == 'mergeReleaseNativeLibs' || task.name == 'mergeReleaseCheckNativeLibs') {
        task.dependsOn 'checkNoDebugBridgeInRelease'
    }
}
