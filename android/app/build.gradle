plugins {
    id 'com.android.application'
}

// Location of the prebuilt native library (libmain.so) to package. Override with
//   -PstratagusNativeDir=/abs/path/to/dir/containing/arm64-v8a
// Default: app/src/main/jniLibs (staged there by the copyNativeLibs task or by hand).
def nativeLibsDir = project.hasProperty('stratagusNativeDir') ?
        project.property('stratagusNativeDir') : "${projectDir}/src/main/jniLibs"

// SDL2's Android Java glue is sourced from the SDL version we build against
// (third-party/SDL), not vendored in our tree. Copy it into a generated source
// dir at build time; it is never committed.
def sdlJavaSrc = "${rootDir}/../third-party/SDL/android-project/app/src/main/java"
def sdlJavaGen = layout.buildDirectory.dir("generated/sdl_java").get().asFile

tasks.register('copySdlJava', Copy) {
    from sdlJavaSrc
    into sdlJavaGen
    include 'org/libsdl/app/**'
}

android {
    namespace 'net.wargushd.game'
    compileSdk 34

    defaultConfig {
        applicationId 'net.wargushd.game'
        minSdk 24
        targetSdk 34
        versionCode 340056
        versionName '3.4.56'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    sourceSets {
        main {
            java.srcDirs += sdlJavaGen
            jniLibs.srcDirs = [nativeLibsDir]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            // Explicit so debuggerd reliably emits a native backtrace/tombstone for the
            // in-game-menu HWUI SIGABRT (WargusHD diagnosis; libmain.so stays a Release build).
            debuggable true
            jniDebuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        // The release configuration signed with the debug key, so that it can be installed on
        // the emulator and the test tablets and checked there. Never distributed.
        releaseCheck {
            initWith release
            debuggable false
            jniDebuggable false
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
        }
    }

    // libmain.so is a Release build with debug info; keep it as-is (do not strip
    // during packaging, and do not fail on the large payload).
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

// CS4: the HD content the game needs at runtime is NOT part of this repo. It is staged into
// assets/ from the content trees, using the manifest that records where each file belongs under
// files/data on the device (recovered in cycle 419; the mapping was previously implicit in the
// harness's push invocations and written down nowhere).
//
// The trees' location is a local path, so it is supplied as a property -- set wargushdDocsRoot in
// local.properties (gitignored) or pass -PwargushdDocsRoot=... -- never hardcoded here. Same idiom
// as stratagusNativeDir above. Without it the task is skipped and the APK builds without content,
// which is exactly what it did before this task existed.
// Gradle does NOT load local.properties into project properties -- the Android plugin reads it only
// for sdk.dir -- so read it explicitly. Without this the property is silently null and the staging
// task never runs, which is exactly how the first attempt produced an APK with no content.
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) { localPropsFile.withInputStream { localProps.load(it) } }
def docsRoot = project.hasProperty('wargushdDocsRoot') ?
        project.property('wargushdDocsRoot') : localProps.getProperty('wargushdDocsRoot')
def contentGen = layout.buildDirectory.dir("generated/wargushd_assets").get().asFile

tasks.register('stageWargushdContent') {
    outputs.dir contentGen
    // The sources live outside this project and are not declared as inputs, so the task
    // cannot tell when they changed: stage on every build rather than package stale content.
    outputs.upToDateWhen { false }
    doLast {
        if (docsRoot == null) {
            logger.lifecycle("wargushdDocsRoot not set - APK will contain no game content")
            return
        }
        def manifest = new File("${docsRoot}/.wargushd/CS4_CONTENT_MANIFEST.tsv")
        if (!manifest.exists()) {
            throw new GradleException("content manifest not found: ${manifest}")
        }
        // The manifest's first path component selects which tree the file comes from.
        def roots = ['changes': "${docsRoot}/.wargushd/fulltree-changes",
                     'backup' : "${docsRoot}/.wargushd/fulltree-backup",
                     'root'   : "${docsRoot}/fulltree-changes",
                     'tools'  : "${docsRoot}/.wargushd/tools"]
        def out = new File(contentGen, 'wargushd')
        out.deleteDir(); out.mkdirs()
        int copied = 0
        def missing = []
        manifest.eachLine('UTF-8') { line ->
            if (!line.trim()) return
            def (src, rel) = line.split('\t', 2)
            def (treeKey, treeRel) = src.split('/', 2)
            def root = roots[treeKey]
            if (root == null) { missing << line; return }
            def from = new File("${root}/${treeRel}")
            if (!from.isFile()) { missing << line; return }
            def to = new File(out, rel)
            to.parentFile.mkdirs()
            to.bytes = from.bytes
            copied++
        }
        // A partial payload is worse than none: it would install and then fail at runtime with no
        // indication which files were absent.
        if (!missing.isEmpty()) {
            throw new GradleException("content manifest lists ${missing.size()} file(s) not on disk, "
                + "first: ${missing[0]}")
        }
        logger.lifecycle("staged ${copied} content files into assets/wargushd")
    }
}

android.sourceSets.main.assets.srcDirs += contentGen

tasks.configureEach { task ->
    if (task.name == 'preBuild') {
        task.dependsOn 'copySdlJava'
    }
}

// The asset merge, not preBuild, is what has to see the staged files: wiring this through preBuild
// left the task out of the graph entirely on the first attempt.
tasks.configureEach { task ->
    if (task.name.startsWith('merge') && task.name.endsWith('Assets')) {
        task.dependsOn 'stageWargushdContent'
    }
}
